dependencies:
  flutter:
    sdk: flutter
  # State Management & DI
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  # Storage & Persistence
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  # Networking
  dio: ^5.4.3
  retrofit: ^4.0.3
  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  # UI
  cached_network_image: ^3.3.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.6

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/quran/ # For JSON data
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
