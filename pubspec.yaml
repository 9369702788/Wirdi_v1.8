name: wirdi
description: Wirdi - Islamic Lifestyle Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: '^3.5.0'  # Required - matches your Flutter version
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  
  # Storage & Persistence
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # Networking
  dio: ^5.4.3
  retrofit: ^4.0.3
  logger: ^2.0.2+1
  
  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.6
  
  # UI
  cached_network_image: ^3.3.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Location & Permissions
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  # Audio
  audioplayers: ^6.0.0
  just_audio: ^0.9.37
  
  # Background Tasks
  workmanager: ^0.5.1
  
  # Firebase (Optional - for production)
  firebase_core: ^2.31.1
  firebase_analytics: ^10.10.7
  firebase_crashlytics: ^3.4.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/quran/
    - assets/data/azkar/
    
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A2E36"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
